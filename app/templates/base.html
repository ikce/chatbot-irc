<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chatbot-irc — {% block title %}{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --fg: #e6e8ec;
      --muted: #8891a2;
      --accent: #4dabf7;
      --ok: #51cf66;
      --err: #ff6b6b;
      --warn: #ffd43b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    header .brand { font-weight: 700; letter-spacing: 0.5px; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      margin-right: 4px;
    }
    header nav a.active { background: var(--border); color: var(--fg); }
    header nav a:hover { color: var(--fg); }
    header .spacer { flex: 1; }
    header .status { font-size: 12px; color: var(--muted); }
    header .status .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--err); margin-right: 6px; vertical-align: middle;
    }
    header .status.ok .dot { background: var(--ok); }
    header .logout { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; color: var(--muted); }
    header .logout button { padding: 4px 10px; font-size: 12px; font-weight: 500; background: transparent; color: var(--muted); border: 1px solid var(--border); }
    header .logout button:hover { color: var(--fg); }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }
    h1 { margin-top: 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
    input[type=text], input[type=password], input[type=number], textarea, select {
      width: 100%;
      background: #0b0d12;
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .checkbox input { width: auto; }
    button, .btn {
      background: var(--accent);
      color: #0b0d12;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .btn.danger { background: var(--err); color: #0b0d12; }
    .toast {
      background: #143d24; color: #b9f6ca; border: 1px solid #1e5a34;
      padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
    small.muted { color: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand">🤖 chatbot-irc</div>
    <nav>
      <a href="/" class="{% if active == 'config' %}active{% endif %}">IRC / ZNC</a>
      <a href="/llm" class="{% if active == 'llm' %}active{% endif %}">LLM</a>
      <a href="/bible" class="{% if active == 'bible' %}active{% endif %}">Bible</a>
      <a href="/intel" class="{% if active == 'intel' %}active{% endif %}">Intel</a>
      <a href="/users" class="{% if active == 'users' %}active{% endif %}">Users</a>
      <a href="/images" class="{% if active == 'images' %}active{% endif %}">Images</a>
      <a href="/moderation" class="{% if active == 'moderation' %}active{% endif %}">Modération</a>
      <a href="/console" class="{% if active == 'console' %}active{% endif %}">Console</a>
      <a href="/help" class="{% if active == 'help' %}active{% endif %}">📘 Commandes</a>
    </nav>
    <div class="spacer"></div>
    <div class="status" id="hdr-status"><span class="dot"></span><span id="hdr-nick">déconnecté</span></div>
    <form class="logout" method="post" action="/logout">
      <span>👤 {{ request.state.user }}</span>
      <button type="submit">Déconnexion</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    async function refreshStatus() {
      try {
        const r = await fetch('/api/status');
        if (r.status === 401) {  // session expirée
          location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
          return;
        }
        const j = await r.json();
        const el = document.getElementById('hdr-status');
        const nickEl = document.getElementById('hdr-nick');
        if (j.irc_connected) {
          el.classList.add('ok');
          nickEl.textContent = j.irc_nick || 'connecté';
        } else {
          el.classList.remove('ok');
          nickEl.textContent = 'déconnecté';
        }
      } catch(e) { /* ignore */ }
    }
    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
